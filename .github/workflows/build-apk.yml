name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: |
          mkdir -p android/keystore android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/timelogger.jks
          cp android/keystore/timelogger.jks android/app/keystore/timelogger.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=timelogger" >> android/key.properties
          echo "storeFile=keystore/timelogger.jks" >> android/key.properties
          ls -la android/keystore/

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (signed and optimized)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          ls -la
          for f in app-*-release.apk; do
            mv "$f" "timelogger-${f}"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: time-logger-apks
          path: build/app/outputs/flutter-apk/timelogger-*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Time Logger v1.0.${{ github.run_number }}"
          body: "New version of Time Logger by Kurosh Shiraz"
          files: build/app/outputs/flutter-apk/timelogger-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- پس‌زمینه با گرادیانت -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00DCA0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0098A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- پس‌زمینه گرد -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- دایره کرنومتر (بیرونی) -->
  <circle cx="256" cy="280" r="150" fill="none" stroke="#FFFFFF" stroke-width="18" opacity="0.95"/>
  <circle cx="256" cy="280" r="150" fill="none" stroke="#FFFFFF" stroke-width="18" 
          stroke-dasharray="700 250" stroke-linecap="round" opacity="0.5"/>

  <!-- تیک‌های ساعت (12، 3، 6، 9) -->
  <line x1="256" y1="145" x2="256" y2="165" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="395" x2="256" y2="415" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="121" y1="280" x2="141" y2="280" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="371" y1="280" x2="391" y2="280" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- عقربه ساعت (به ساعت ۱۰ اشاره می‌کند) -->
  <line x1="256" y1="280" x2="195" y2="215" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <!-- عقربه دقیقه (به دقیقه ۲ اشاره می‌کند) -->
  <line x1="256" y1="280" x2="305" y2="230" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- نقطه مرکزی -->
  <circle cx="256" cy="280" r="14" fill="#FFFFFF"/>

  <!-- دکمه بالای کرنومتر (استارت) -->
  <rect x="230" y="95" width="52" height="30" rx="8" fill="#FFFFFF"/>
  <!-- پایه کوچک بین دکمه و کرنومتر -->
  <rect x="242" y="120" width="28" height="20" fill="#FFFFFF"/>

  <!-- نمودار میله‌ای در پایین سمت راست -->
  <rect x="300" y="360" width="18" height="35" rx="4" fill="url(#chartGrad)"/>
  <rect x="326" y="340" width="18" height="55" rx="4" fill="url(#chartGrad)"/>
  <rect x="352" y="320" width="18" height="75" rx="4" fill="url(#chartGrad)"/>
  <rect x="378" y="300" width="18" height="95" rx="4" fill="url(#chartGrad)"/>

  <!-- فلش رو به بالا (نمودار صعودی) -->
  <path d="M 300 355 L 340 330 L 370 340 L 395 295" 
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 395 295 L 380 298 L 388 310 Z" fill="#FFFFFF"/>
</svg>